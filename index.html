<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ngola Finanças</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 160'%3E%3Cg fill='none' stroke='%23222' stroke-width='13' stroke-linecap='round'%3E%3Cpath d='M50 42C18 62 18 112 50 136'/%3E%3Cpath d='M62 44C84 58 84 96 66 118'/%3E%3C/g%3E%3Ccircle cx='56' cy='24' r='14' fill='%23222'/%3E%3Crect x='20' y='142' width='64' height='12' fill='%23222'/%3E%3C/svg%3E">
<style>
:root{--bg:#faf9f5;--side:#f0eee6;--card:#fff;--text:#3d3929;--muted:#83827d;--line:#e8e6dc;--accent:#d97757;--user:#f0eee6}
@media (prefers-color-scheme:dark){:root{--bg:#262624;--side:#1f1e1d;--card:#30302e;--text:#e8e6dc;--muted:#9c9a92;--line:#434341;--user:#3a3a37}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex}
.ico{width:1em;height:1.6em;color:var(--text);vertical-align:middle}
aside{width:270px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px}
.logo{font-family:Georgia,serif;font-size:21px;display:flex;align-items:center;gap:8px;margin-bottom:14px}
#nova{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;font-size:15px;text-align:left}
#nova:hover{border-color:var(--accent)}
.titulo{color:var(--muted);font-size:12px;margin:18px 6px 6px}
#lista{flex:1;overflow-y:auto}
#lista div{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lista div:hover,#lista div.ativa{background:var(--line)}
main{flex:1;display:flex;flex-direction:column;min-width:0}
#menu{display:none;background:none;border:0;font-size:22px;color:var(--text);padding:10px 16px;text-align:left;cursor:pointer}
#chat{flex:1;overflow-y:auto;padding:24px 16px}
.wrap{max-width:720px;margin:0 auto}
#vazio{text-align:center;margin-top:10vh}
#vazio .ico{font-size:64px;height:1.2em}
#vazio h1{font-family:Georgia,serif;font-weight:400;font-size:36px;margin:8px 0}
#vazio p{color:var(--muted);margin:0 0 20px}
.sugestoes{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sugestoes button{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px}
.sugestoes button:hover{border-color:var(--accent)}
.msg{margin:16px 0;line-height:1.6;white-space:pre-wrap}
.msg.user{background:var(--user);padding:10px 16px;border-radius:18px;max-width:85%;margin-left:auto;width:fit-content}
.msg.ngola{font-family:Georgia,serif;font-size:17px}
.meta{color:var(--muted);font-family:system-ui,sans-serif;font-size:12px;margin-top:6px}
footer{padding:12px 16px 20px}
.caixa{max-width:720px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px 10px 10px 18px;display:flex;align-items:flex-end;gap:8px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
textarea{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--text);font:inherit;font-size:16px;max-height:140px;padding:8px 0}
#enviar{background:var(--accent);color:#fff;border:0;border-radius:12px;width:38px;height:38px;font-size:18px;cursor:pointer}
#enviar:disabled{opacity:.5}
.aviso{text-align:center;color:var(--muted);font-size:12px;margin-top:8px}
#fechar{display:none;margin-left:auto;background:none;border:0;font-size:20px;color:var(--text);cursor:pointer}
@media(max-width:760px){aside{position:fixed;inset:0 auto 0 0;z-index:5;transform:translateX(-100%);transition:.2s}aside.aberta{transform:none}#menu{display:block}#fechar{display:block}aside.aberta+#fundo{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:4}}
.fb{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-family:system-ui,sans-serif;font-size:13px;color:var(--muted)}
.fb button{background:none;border:1px solid var(--line);border-radius:8px;padding:2px 9px;cursor:pointer;font-size:14px;color:var(--text)}
.fb button:hover{border-color:var(--accent)}
.msg pre{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--user);padding:12px;border-radius:10px;overflow-x:auto;white-space:pre;margin:10px 0;line-height:1.45}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="pensador" viewBox="0 0 100 160"><g fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round"><path d="M50 42C18 62 18 112 50 136"/><path d="M62 44C84 58 84 96 66 118"/></g><circle cx="56" cy="24" r="14" fill="currentColor"/><rect x="20" y="142" width="64" height="12" fill="currentColor"/></symbol></svg>

<aside id="lateral">
  <div class="logo"><svg class="ico"><use href="#pensador"/></svg> Ngola<button id="fechar" aria-label="Fechar menu">✕</button></div>
  <button id="nova">＋ Nova conversa</button>
  <div class="titulo">Conversas</div>
  <div id="lista"></div>
</aside>
<div id="fundo"></div>

<main>
  <button id="menu">☰</button>
  <div id="chat"><div class="wrap">
    <div id="vazio">
      <svg class="ico"><use href="#pensador"/></svg>
      <h1>Olá, sou a Ngola</h1>
      <p>A tua assistente de finanças pessoais em Kwanzas.</p>
      <div class="sugestoes">
        <button>Como poupar dinheiro?</button>
        <button>Quanto custa o dólar?</button>
        <button>O que são certificados de aforro?</button>
        <button>Como fazer um orçamento?</button>
      </div>
    </div>
    <div id="mensagens"></div>
  </div></div>
  <footer>
    <div class="caixa">
      <textarea id="pergunta" rows="1" placeholder="Pergunta-me sobre poupança, câmbio, crédito..."></textarea>
      <button id="enviar" title="Enviar">↑</button>
    </div>
    <div class="aviso">A Ngola está a aprender e pode errar. · versão 10</div>
  </footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="dados.js?v=13"></script>
<script src="ngola.js?v=13"></script>
<script src="areas.js?v=13"></script>
<script src="biblioteca.js?v=13"></script>
<script src="roteador.js?v=13"></script>
<script src="app.js?v=13"></script>
</body>
</html>
