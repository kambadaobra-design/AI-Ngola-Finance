<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ngola Finanças</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✳️</text></svg>">
<style>
:root{--bg:#faf9f5;--card:#ffffff;--text:#3d3929;--muted:#83827d;--line:#e8e6dc;--accent:#d97757;--user:#f0eee6}
@media (prefers-color-scheme:dark){:root{--bg:#262624;--card:#30302e;--text:#e8e6dc;--muted:#9c9a92;--line:#434341;--user:#3a3a37}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{padding:14px 20px;font-family:Georgia,"Times New Roman",serif;font-size:22px;border-bottom:1px solid var(--line)}
header span{color:var(--accent)}
#chat{flex:1;overflow-y:auto;padding:24px 16px}
.wrap{max-width:720px;margin:0 auto}
#vazio{text-align:center;margin-top:12vh}
#vazio h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:38px;margin:0 0 8px}
#vazio h1 span{color:var(--accent)}
#vazio p{color:var(--muted);margin:0 0 20px}
.sugestoes{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sugestoes button{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px}
.sugestoes button:hover{border-color:var(--accent)}
.msg{margin:16px 0;line-height:1.6;white-space:pre-wrap}
.msg.user{background:var(--user);padding:10px 16px;border-radius:18px;max-width:85%;margin-left:auto;width:fit-content}
.msg.ngola{font-family:Georgia,"Times New Roman",serif;font-size:17px}
.meta{color:var(--muted);font-family:system-ui,sans-serif;font-size:12px;margin-top:6px}
footer{padding:12px 16px 20px}
.caixa{max-width:720px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px 10px 10px 18px;display:flex;align-items:flex-end;gap:8px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
textarea{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--text);font:inherit;font-size:16px;max-height:140px;padding:8px 0}
#enviar{background:var(--accent);color:#fff;border:0;border-radius:12px;width:38px;height:38px;font-size:18px;cursor:pointer}
#enviar:disabled{opacity:.5}
.aviso{text-align:center;color:var(--muted);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<header><span>✳</span> Ngola Finanças</header>

<div id="chat"><div class="wrap">
  <div id="vazio">
    <h1><span>✳</span> Olá, sou a Ngola</h1>
    <p>A tua assistente de finanças pessoais em Kwanzas.</p>
    <div class="sugestoes">
      <button>Como poupar dinheiro?</button>
      <button>Quanto custa o dólar?</button>
      <button>Como pedir um empréstimo?</button>
      <button>Como fazer um orçamento?</button>
    </div>
  </div>
  <div id="mensagens"></div>
</div></div>

<footer>
  <div class="caixa">
    <textarea id="pergunta" rows="1" placeholder="Pergunta-me sobre poupança, câmbio, crédito..."></textarea>
    <button id="enviar" title="Enviar">↑</button>
  </div>
  <div class="aviso">A Ngola está a aprender e pode errar.</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="dados.js"></script>
<script src="ngola.js"></script>
<script src="app.js"></script>
</body>
</html>
